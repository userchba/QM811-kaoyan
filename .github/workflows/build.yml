# 自动构建 811 量子力学真题集
#
# 触发时机：
#   - push 到 master/main
#   - 打 tag（如 2026）时构建并上传 PDF 到 Release 附件
#   - 手动触发
#
# 产物：811.pdf（含答案版）、811_noanswer.pdf（纯试题版）

name: Build PDF

on:
  push:
    branches: [master, main]
    tags: ['*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 TeX Live 与中文字体
        uses: xu-cheng/latex-action@v3
        with:
          # 使用 xelatex，并安装本项目需要的宏包
          root_file: 811.tex
          latexmk_use_xelatex: true
          # 两遍不够：目录页码需要迭代至收敛，故后续步骤会再补编译
          pre_compile: |
            tlmgr install ctex fandol svg transparent zref \
              ascolorbox 2>/dev/null || true

      - name: 安装系统工具
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: 构建两个版本
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 校验产物
        run: |
          for f in 811.pdf 811_noanswer.pdf; do
            test -f "$f" || { echo "缺少 $f"; exit 1; }
            pages=$(pdfinfo "$f" | awk '/^Pages/{print $2}')
            echo "$f: $pages 页"
          done

      - name: 校验目录链接完整
        run: |
          python3 - <<'PY'
          import re, sys
          # 目录必须包含全部年份条目（含可点击锚点）
          toc = open('811.toc').read() if __import__('os').path.exists('811.toc') else ''
          n = len(re.findall(r'\\contentsline', toc))
          print(f'目录条目数: {n}')
          if n < 29:
              sys.exit('目录条目少于 29 条，可能编译未收敛')
          PY

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QM811-PDF
          path: |
            811.pdf
            811_noanswer.pdf

      - name: 附加到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            811.pdf
            811_noanswer.pdf
          body_path: RELEASE_2026.md
