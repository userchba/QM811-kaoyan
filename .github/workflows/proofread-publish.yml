name: Publish verified proofreading
on:
  push:
    branches: [master]
    paths: ['.github/workflows/proofread-publish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hash-checked source patch
        run: |
          python3 - <<'PY'
          import base64, lzma, hashlib, subprocess
          from pathlib import Path
          encoded = ''''''
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '2a2d1afc69b946649281783a83e39456233d5350dc5512990e1ec068f7f9d25d'
          path = Path('/tmp/verified-proofreading.patch')
          path.write_bytes(patch)
          subprocess.run(['git','apply','--index','--unidiff-zero','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','diff','--cached','--stat'],check=True)
          PY
      - name: Rebuild both PDFs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: build.sh
          compiler: bash
          args: ""
          extra_system_packages: poppler-utils
      - name: Commit reviewed source and PDFs to master
        run: |
          set -eu
          git fetch origin master
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add -- '1/*.tex' style.cls build.sh 811.pdf 811_noanswer.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: proofread QM811 questions and solutions and rebuild PDFs'
          git push origin HEAD:master
          git rev-parse HEAD > REVIEW_COMMIT.txt
          sha256sum 811.pdf 811_noanswer.pdf > PDF_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: QM811-reviewed-pdfs
          path: |
            811.pdf
            811_noanswer.pdf
            REVIEW_COMMIT.txt
            PDF_SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
