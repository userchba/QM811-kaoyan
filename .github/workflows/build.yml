# Build both PDFs inside the same TeX Live environment.
name: Build PDF
on:
  push:
    branches: [master, main]
    tags: ['*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build both PDFs in TeX Live
        uses: xu-cheng/latex-action@v3
        with:
          root_file: build.sh
          compiler: bash
          args: ""
          extra_system_packages: poppler-utils
      - name: Verify nonempty PDFs
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          for name in ("811.pdf", "811_noanswer.pdf"):
              p = Path(name)
              assert p.stat().st_size > 1000, name
              with p.open("rb") as f:
                  assert f.read(5) == b"%PDF-", name
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: QM811-PDF
          path: |
            811.pdf
            811_noanswer.pdf
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: QM811-PDF
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            811.pdf
            811_noanswer.pdf
          body_path: RELEASE_2026.md
