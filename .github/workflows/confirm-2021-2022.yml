name: Publish confirmed 2021 and 2022 corrections
on:
  push:
    branches: [master]
    paths: ['.github/workflows/confirm-2021-2022.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply the two user-confirmed interpretations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def once(text, old, new):
              assert text.count(old) == 1, ('Unexpected source content', old[:100], text.count(old))
              return text.replace(old, new, 1)
          p = Path('1/2021.tex')
          text = p.read_text(encoding='utf-8')
          text = once(text,
              r'若两粒子为自旋 $\frac{1}{2}$ 的全同粒子，求基态与第一激发态的能级简并度以及相应的波函数。',
              r'若两粒子为自旋 $0$ 的全同玻色子，求基态与第一激发态的能级简并度以及相应的波函数。')
          begin = text.index(r'\item 源文件的第 (3) 问与第 (2) 问逐字重复')
          end = text.index(r'\end{enumerate}', begin)
          text = text[:begin] + r'''\item 对两个自旋为 $0$ 的全同玻色子，没有额外的自旋简并，空间波函数必须对称。
          基态为两个粒子均占据单粒子基态：
          \[
          \boxed{\Psi_{\rm g}^{\rm B}(x_1,x_2)=\phi_1(x_1)\phi_1(x_2)},
          \qquad E_{\rm g}=2\varepsilon_1,\qquad \boxed{g_{\rm g}=1}.
          \]
          第一激发态为一个粒子占据 $n=1$、另一个占据 $n=2$ 的对称组合：
          \[
          \boxed{\Psi_{\rm e}^{\rm B}(x_1,x_2)=
          \frac{\phi_1(x_1)\phi_2(x_2)+\phi_2(x_1)\phi_1(x_2)}{\sqrt2}}.
          \]
          由单粒子态的正交归一性，上式已归一化；交换粒子标签不产生新的独立态。
          因此
          \[
          E_{\rm e}=\varepsilon_1+\varepsilon_2=5\varepsilon_1,
          \qquad \boxed{g_{\rm e}=1}.
          \]
          ''' + text[end:]
          assert '源文件的第 (3) 问与第 (2) 问逐字重复' not in text
          p.write_text(text, encoding='utf-8')
          p = Path('1/2022.tex')
          text = p.read_text(encoding='utf-8')
          text = once(text,
              r'若引入微扰 $H^{\prime}=-V_{0} \exp \left(-\frac{x^{2}}{a^{2}}\right) $，其中$0<x<L$，$ a<<L$， 求能级的一级修正。',
              r'若引入微扰 $H^{\prime}(x)=-V_{0}\exp(-x^{2}/a^{2})$，在基本区间 $0<x<L$ 按此单边函数定义，$a\ll L$，求能级的一级修正。')
          begin = text.index(r'\item 题面把圆环坐标写成 $0<x<L$')
          end = text.index(r'\end{enumerate}', begin)
          text = text[:begin] + r'''\item 按题设的单边定义，微扰矩阵元只在 $0<x<L$ 积分，不补入关于 $x=0$ 对称的另一半高斯峰。令
          \[
          \alpha=-\frac{V_0}{L}\int_0^L e^{-x^2/a^2}\,dx
          =-\frac{V_0a\sqrt\pi}{2L}\operatorname{erf}(L/a)
          \simeq-\frac{V_0a\sqrt\pi}{2L}.
          \]
          基态非简并，故
          \[
          \boxed{E_0^{(1)}=\alpha\simeq-\frac{V_0a\sqrt\pi}{2L}}.
          \]
          对 $n=1,2,\ldots$，在简并子空间 $\{|n\rangle,|-n\rangle\}$ 中，
          \[
          W_n=\begin{pmatrix}\alpha&\beta_n\\\beta_n^*&\alpha\end{pmatrix},
          \qquad
          \beta_n=-\frac{V_0}{L}\int_0^L e^{-x^2/a^2}e^{-i4\pi nx/L}\,dx.
          \]
          由 $\det(W_n-\lambda I)=(\alpha-\lambda)^2-|\beta_n|^2=0$，得到
          \[
          \boxed{E_{n,\pm}^{(1)}=\alpha\pm|\beta_n|},
          \qquad
          E_{n,\pm}\simeq E_n^{(0)}+E_{n,\pm}^{(1)}.
          \]
          这是一阶微扰论在有限 $L$ 下的积分表达式。利用 $a\ll L$ 将积分上限延到 $+\infty$，记
          $u=2\pi na/L$、$C=V_0a\sqrt\pi/(2L)$，则
          \[
          \beta_n\simeq-Ce^{-u^2}\bigl[1-i\operatorname{erfi}(u)\bigr],
          \qquad
          \operatorname{erfi}(u)=\frac{2}{\sqrt\pi}\int_0^u e^{s^2}\,ds.
          \]
          因而
          \[
          \boxed{E_{n,\pm}^{(1)}\simeq-C
          \pm |C|e^{-u^2}\sqrt{1+\operatorname{erfi}^2(u)}}.
          \]
          单边积分一般为复数，不能只取 $\beta_n$ 的实部。若进一步固定 $n$ 并取
          $a/L\to0$（即 $u\ll1$），才可用 $\beta_n\simeq\alpha$，得到最低阶结果
          \[
          \boxed{E_{n,\cos}^{(1)}\simeq-\frac{V_0a\sqrt\pi}{L}},
          \qquad \boxed{E_{n,\sin}^{(1)}\simeq0},
          \]
          相应零级态趋于
          \[
          \sqrt{\frac2L}\cos\!\left(\frac{2\pi nx}{L}\right),
          \qquad
          \sqrt{\frac2L}\sin\!\left(\frac{2\pi nx}{L}\right).
          \]
          其中 $0$ 仅表示对 $a/L$ 保留最低阶时为零，并非有限 $a$ 下严格为零；上述简化也不能直接用于 $na/L$ 不小的高能级。
          ''' + text[end:]
          assert r'\alpha_{\rm per}' not in text
          assert '若命题本意是以圆环上的点' not in text
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff --stat
      - name: Build answer and question-only PDFs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: build.sh
          compiler: bash
          args: ""
          extra_system_packages: poppler-utils
      - name: Validate outputs and commit to master without force
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('811.pdf', '811_noanswer.pdf'):
              p=Path(name)
              assert p.stat().st_size > 1000
              assert p.read_bytes()[:5] == b'%PDF-'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 1/2021.tex 1/2022.tex 811.pdf 811_noanswer.pdf
          git commit -m 'fix: confirm 2021 spin-zero bosons and 2022 one-sided Gaussian; rebuild PDFs'
          git push origin HEAD:master
          git rev-parse HEAD > PUBLISHED_COMMIT.txt
          sha256sum 811.pdf 811_noanswer.pdf > SHA256SUMS.txt
          git show --format=fuller --stat HEAD > CHANGE_SUMMARY.txt
          git archive --format=tar.gz HEAD > confirmed-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: QM811-confirmed-2021-2022
          path: |
            811.pdf
            811_noanswer.pdf
            PUBLISHED_COMMIT.txt
            SHA256SUMS.txt
            CHANGE_SUMMARY.txt
            confirmed-source.tar.gz
          if-no-files-found: error
          retention-days: 14
